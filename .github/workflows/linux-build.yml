            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  build-flatpak-x64:
    name: Build Flatpak (x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Cache Electron build dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-build-${{ runner.os }}-x64-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-build-${{ runner.os }}-x64-

      - name: Setup Node app
        uses: ./.github/actions/setup-node-app

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 org.electronjs.Electron2.BaseApp//25.08

      - name: Run tests
        run: npm test

      - name: Build Electron app for Flatpak
        run: |
          npx electron-builder --linux dir --x64 --publish never
          rm -rf build-flatpak/staging/linux-unpacked
          cp -a dist/linux-unpacked build-flatpak/staging/linux-unpacked
          test -f build-flatpak/staging/linux-unpacked/tree-ide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Flatpak bundle
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test -d build-flatpak/staging/linux-unpacked
          sudo flatpak-builder --repo=repo --force-clean --install-deps-from=flathub --default-branch=stable .flatpak-build build-flatpak/flatpak/com.treeide.treeide.yml
          sudo flatpak build-bundle repo "dist/Tree-IDE-${VERSION}-x86_64.flatpak" com.treeide.treeide stable

      - name: Upload Flatpak x86_64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: tree-ide-linux-flatpak-x64
          path: dist/*.flatpak
          if-no-files-found: error

  build-flatpak-arm:
    name: Build Flatpak (aarch64)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
