          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Platform/aarch64/25.08 org.freedesktop.Sdk/aarch64/25.08 org.electronjs.Electron2.BaseApp/aarch64/25.08

      - name: Run tests
        run: npm test

      - name: Build Electron app for Flatpak
        run: |
          npx electron-builder --linux dir --arm64 --publish never
          rm -rf build-flatpak/staging/linux-unpacked
          cp -a dist/linux-arm64-unpacked build-flatpak/staging/linux-unpacked
          test -f build-flatpak/staging/linux-unpacked/tree-ide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Flatpak bundle
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test -d build-flatpak/staging/linux-unpacked
          sudo flatpak-builder --repo=repo --force-clean --install-deps-from=flathub --default-branch=stable .flatpak-build build-flatpak/flatpak/com.treeide.treeide.yml
          sudo flatpak build-bundle repo "dist/Tree-IDE-${VERSION}-aarch64.flatpak" com.treeide.treeide stable

      - name: Upload Flatpak aarch64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: tree-ide-linux-flatpak-arm64
          path: dist/*.flatpak
          if-no-files-found: error



