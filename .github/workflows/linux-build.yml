name: Build Linux

permissions:
  actions: write
  contents: write
  models: read

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  build-linux-x64:
    name: Build AppImage, DEB and Snap (x64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Cache Electron build dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-build-${{ runner.os }}-x64-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-build-${{ runner.os }}-x64-

      - name: Setup Node app
        uses: ./.github/actions/setup-node-app

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version $PACKAGE_VERSION."
            exit 1
          fi

      - name: Install Snapcraft
        run: |
          if ! command -v snapcraft >/dev/null 2>&1; then
            sudo snap install snapcraft --classic --channel=latest/stable
          fi
          snapcraft --version

      - name: Run tests
        run: npm test

      - name: Build Linux x64 artifacts (AppImage + DEB + Snap)
        run: |
          MAX_ATTEMPTS=3
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            PUBLISH_MODE="always"
          else
            PUBLISH_MODE="never"
          fi

          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "electron-builder attempt $attempt of $MAX_ATTEMPTS"
            npx electron-builder --linux AppImage deb --x64 --publish "$PUBLISH_MODE" \
              && npx electron-builder --linux snap --x64 --publish never \
              && break

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              DELAY=$((20 * attempt))
              echo "electron-builder failed. Retrying in $DELAY seconds..."
              sleep $DELAY
            else
              exit 1
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean old build caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CACHES_JSON=$(gh cache list --limit 1000 --json id,key,createdAt)

          if [ -z "$CACHES_JSON" ] || [ "$CACHES_JSON" = "[]" ]; then
            echo "No caches found."
            exit 0
          fi

          get_cache_family() {
            echo "$1" | sed -E 's/-[a-f0-9]{32,64}$//' | sed -E 's/-[0-9a-f]{8,}$//'
          }

          echo "$CACHES_JSON" | jq -r '.[].key' | while read -r key; do
            get_cache_family "$key"
          done | sort -u | while read -r family; do
            LATEST_ID=$(echo "$CACHES_JSON" | jq -r --arg fam "$family" '
              [.[] | select(.key | startswith($fam))] |
              sort_by(.createdAt) | reverse | .[0].id | tostring
            ')

            if [ -z "$LATEST_ID" ] || [ "$LATEST_ID" = "null" ]; then
              continue
            fi

            echo "Keeping latest cache for $family: $LATEST_ID"

            echo "$CACHES_JSON" | jq -r --arg fam "$family" --arg keep "$LATEST_ID" '
              [.[] | select(.key | startswith($fam)) | select((.id | tostring) != $keep) | .id | tostring] | .[]
            ' | while read -r old_id; do
              if [ -z "$old_id" ]; then
                continue
              fi
              echo "Deleting old cache for $family: $old_id"
              gh cache delete "$old_id" || echo "Cache $old_id already removed, skipping."
            done
          done

      - name: Upload Linux x64 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tree-ide-linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.snap
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  build-linux-arm:
    name: Build AppImage and DEB (arm64)
