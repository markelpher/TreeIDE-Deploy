        run: |
          CACHES_JSON=$(gh cache list --limit 1000 --json id,key,createdAt)

          if [ -z "$CACHES_JSON" ] || [ "$CACHES_JSON" = "[]" ]; then
            echo "No caches found."
            exit 0
          fi

          get_cache_family() {
            echo "$1" | sed -E 's/-[a-f0-9]{32,64}$//' | sed -E 's/-[0-9a-f]{8,}$//'
