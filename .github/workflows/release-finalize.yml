name: Release Finalize

permissions:
  actions: read
  contents: write
  models: read

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA for the release tag
        required: true
        type: string
      tag:
        description: Release tag
        required: true
        type: string
  workflow_call:
    inputs:
      sha:
        description: Commit SHA for the release tag
        required: true
        type: string
      tag:
        description: Release tag
        required: true
        type: string

concurrency:
  group: release-finalize-${{ inputs.sha }}
  cancel-in-progress: false

jobs:
  finalize:
    name: Translate, localize, and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Resolve release metadata
        id: meta
        run: |
          tag="${{ inputs.tag }}"
          prev=$(git tag --sort=-v:refname | grep '^v' | grep -v "^$tag$" | head -1 || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=${{ inputs.sha }}" >> "$GITHUB_OUTPUT"
          echo "prev=${prev:-}" >> "$GITHUB_OUTPUT"
          is_prerelease='false'
          if echo "$tag" | grep -qE '(beta|alpha|rc)'; then
            is_prerelease='true'
          fi
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"

      - name: Skip when release is already published
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          is_draft=$(gh release view "$tag" --json isDraft -q '.isDraft' 2>/dev/null || echo "true")
          if [ "$is_draft" = "false" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "Release $tag is already published — skipping."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for draft release to be created
        if: steps.published.outputs.already != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          for attempt in $(seq 1 18); do
            if gh release view "$tag" > /dev/null 2>&1; then
              exit 0
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "::error::Draft release $tag was not created by electron-builder."
              exit 1
            fi
            echo "Draft release not ready yet, waiting 10s (attempt $attempt/18)..."
            sleep 10
          done

      - name: Build multilingual changelog
        if: steps.published.outputs.already != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/build-release-changelogs.mjs \
            "${{ steps.meta.outputs.prev }}" \
            "${{ steps.meta.outputs.tag }}" \
            "$RUNNER_TEMP/changelogs" \
            --sync-docs

      - name: Download all platform build artifacts
        if: steps.published.outputs.already != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${{ steps.meta.outputs.sha }}"
          mkdir -p dist

          for workflow in "Build Windows" "Build Linux" "Build macOS"; do
            run_id=$(gh run list \
              --workflow "$workflow" \
              --commit "$sha" \
              --json databaseId \
              -q '.[0].databaseId')
            echo "Downloading artifacts from $workflow (run $run_id)"
            gh run download "$run_id" --dir dist
          done

      - name: Inject localized releaseNotes into all latest*.yml
        if: steps.published.outputs.already != 'true'
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          mapfile -t yml_files < <(find dist -type f -name 'latest*.yml' | sort -u)

          if [ "${#yml_files[@]}" -eq 0 ]; then
            echo "::error::No latest*.yml files found in downloaded artifacts."
            exit 1
          fi

          args=()
          for f in "${yml_files[@]}"; do
            args+=(--latest "$f")
          done

          node scripts/inject-localized-notes.mjs \
            "${args[@]}" \
            --note "en=$RUNNER_TEMP/changelogs/en.md" \
            --note "pt=$RUNNER_TEMP/changelogs/pt.md" \
            --note "es=$RUNNER_TEMP/changelogs/es.md"

      - name: Re-upload localized latest*.yml to release
        if: steps.published.outputs.already != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          shopt -s globstar nullglob
          mapfile -t yml_files < <(find dist -type f -name 'latest*.yml' | sort -u)

          for f in "${yml_files[@]}"; do
            echo "[finalize] Uploading $(basename "$f") (clobber)"
            gh release upload --clobber "$tag" "$f"
          done

      - name: Upload Snap packages to release
        if: steps.published.outputs.already != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          shopt -s globstar nullglob
          snaps=(dist/**/*.snap)

          if [ "${#snaps[@]}" -eq 0 ]; then
            echo "::warning::No Snap packages found in artifacts."
            exit 0
          fi

          for f in "${snaps[@]}"; do
            echo "[finalize] Uploading $(basename "$f")"
            gh release upload --clobber "$tag" "$f"
          done

      - name: Upload Flatpak bundles to release
        if: steps.published.outputs.already != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          shopt -s globstar nullglob
          flatpaks=(dist/**/*.flatpak)

          if [ "${#flatpaks[@]}" -eq 0 ]; then
            echo "::warning::No Flatpak bundles found in artifacts."
            exit 0
          fi

          for f in "${flatpaks[@]}"; do
            echo "[finalize] Uploading $(basename "$f")"
            gh release upload --clobber "$tag" "$f"
          done

      - name: Upload changelog files to release
        if: steps.published.outputs.already != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          gh release upload --clobber "$tag" \
            "$RUNNER_TEMP/changelogs/changelog.md" \
            "$RUNNER_TEMP/changelogs/en.md" \
            "$RUNNER_TEMP/changelogs/pt.md" \
            "$RUNNER_TEMP/changelogs/es.md"

      - name: Publish GitHub release
        if: steps.published.outputs.already != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          version="${tag#v}"
          release_name="Tree IDE v${version}"
          edit_args=(
            release edit "$tag"
            --title "$release_name"
            --notes-file "$RUNNER_TEMP/changelogs/github-release.md"
            --draft=false
          )
          if [ "${{ steps.meta.outputs.is_prerelease }}" = 'true' ]; then
            edit_args+=(--prerelease)
          else
            edit_args+=(--latest)
          fi
          gh "${edit_args[@]}"
          echo "[finalize] Release $tag published with localized notes and all platform artifacts."

      - name: Commit localized changelog docs
        if: steps.published.outputs.already != 'true'
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          branch="${{ github.event.repository.default_branch }}"

          cp docs/changelogs/pt.md "$RUNNER_TEMP/changelog-pt-doc.md"
          cp docs/changelogs/es.md "$RUNNER_TEMP/changelog-es-doc.md"

          git fetch origin "$branch"
          git switch "$branch"

          cp "$RUNNER_TEMP/changelog-pt-doc.md" docs/changelogs/pt.md
          cp "$RUNNER_TEMP/changelog-es-doc.md" docs/changelogs/es.md

          if git diff --quiet -- docs/changelogs/pt.md docs/changelogs/es.md; then
            echo "[finalize] Localized changelog docs are already up to date."
            exit 0
          fi

          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/changelogs/pt.md docs/changelogs/es.md
          git commit -m "docs: updated localized changelogs for $tag"
          git push origin "HEAD:$branch"
