name: Build macOS

permissions:
  actions: write
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  build-macos-arm64:
    name: Build DMG and ZIP (arm64)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Cache Electron build dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-build-${{ runner.os }}-arm64-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-build-${{ runner.os }}-arm64-

      - name: Setup Node app
        uses: ./.github/actions/setup-node-app

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version $PACKAGE_VERSION."
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Build macOS arm64 artifacts (DMG + ZIP)
        run: |
          MAX_ATTEMPTS=3
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            PUBLISH_MODE="always"
          else
            PUBLISH_MODE="never"
          fi

          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "electron-builder attempt $attempt of $MAX_ATTEMPTS"
            npx electron-builder --mac dmg zip --arm64 --publish "$PUBLISH_MODE" && break

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              DELAY=$((20 * attempt))
              echo "electron-builder failed. Retrying in $DELAY seconds..."
              sleep $DELAY
            else
              exit 1
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean old build caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CACHES_JSON=$(gh cache list --limit 1000 --json id,key,createdAt)

          if [ -z "$CACHES_JSON" ] || [ "$CACHES_JSON" = "[]" ]; then
            echo "No caches found."
            exit 0
          fi

          get_cache_family() {
            echo "$1" | sed -E 's/-[a-f0-9]{32,64}$//' | sed -E 's/-[0-9a-f]{8,}$//'
          }

          echo "$CACHES_JSON" | jq -r '.[].key' | while read -r key; do
            get_cache_family "$key"
          done | sort -u | while read -r family; do
            LATEST_ID=$(echo "$CACHES_JSON" | jq -r --arg fam "$family" '
              [.[] | select(.key | startswith($fam))] |
              sort_by(.createdAt) | reverse | .[0].id | tostring
            ')

            if [ -z "$LATEST_ID" ] || [ "$LATEST_ID" = "null" ]; then
              continue
            fi

            echo "Keeping latest cache for $family: $LATEST_ID"

            echo "$CACHES_JSON" | jq -r --arg fam "$family" --arg keep "$LATEST_ID" '
              [.[] | select(.key | startswith($fam)) | select((.id | tostring) != $keep) | .id | tostring] | .[]
            ' | while read -r old_id; do
              if [ -z "$old_id" ]; then
                continue
              fi
              echo "Deleting old cache for $family: $old_id"
              gh cache delete "$old_id" || echo "Cache $old_id already removed, skipping."
            done
          done

      - name: Upload macOS arm64 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tree-ide-macos-arm64
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml
          if-no-files-found: error

  dispatch-release-finalize:
    name: Dispatch release finalize
    needs:
      - build-macos-arm64
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      run_finalize: ${{ steps.dispatch.outputs.run_finalize }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Dispatch release finalize when all platforms are ready
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-dispatch-release-finalize.sh "${{ github.sha }}" "${{ github.ref_name }}" "Build macOS"

  release-finalize:
    name: Release finalize
    needs: dispatch-release-finalize
    if: needs.dispatch-release-finalize.outputs.run_finalize == 'true'
    permissions:
      actions: read
      contents: write
      models: read
    uses: ./.github/workflows/release-finalize.yml
    with:
      sha: ${{ github.sha }}
      tag: ${{ github.ref_name }}
    secrets: inherit

