name: Build Windows

permissions:
  actions: write
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  build-windows:
    name: Build MSI, EXE and Portable
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Cache Electron build dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-build-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")

          if ($packageVersion -ne $tagVersion) {
            Write-Error "Release tag ${{ github.ref_name }} does not match package.json version $packageVersion."
            exit 1
          }

      - name: Run tests
        run: npm test

      - name: Build Windows artifacts
        shell: pwsh
        run: |
          $maxAttempts = 3

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "electron-builder attempt $attempt of $maxAttempts"
            npx electron-builder --win nsis msi portable --x64 --publish never

            if ($LASTEXITCODE -eq 0) {
              exit 0
            }

            if ($attempt -lt $maxAttempts) {
              $delaySeconds = 20 * $attempt
              Write-Host "electron-builder failed with exit code $LASTEXITCODE. Retrying in $delaySeconds seconds..."
              Start-Sleep -Seconds $delaySeconds
            }
          }

          exit $LASTEXITCODE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean old build caches
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $currentRefDate = [datetime](git log -1 --format=%cI HEAD)

          $prefixes = @(
            "electron-build-${{ runner.os }}-",
            "node-cache-${{ runner.os }}-npm-"
          )

          foreach ($prefix in $prefixes) {
            $caches = @(gh cache list --key $prefix --limit 100 --json id,key,createdAt |
              ConvertFrom-Json |
              Sort-Object { [datetime]$_.createdAt } -Descending)

            if (-not $caches) {
              Write-Host "No caches found for prefix $prefix."
              continue
            }

            $cacheToKeep = $caches |
              Where-Object { [datetime]$_.createdAt -lt $currentRefDate } |
              Select-Object -First 1

            if (-not $cacheToKeep) {
              $cacheToKeep = $caches | Select-Object -First 1
            }

            Write-Host "Keeping latest previous cache for ${prefix}: $($cacheToKeep.key)"

            $caches |
              Where-Object { $_.id -ne $cacheToKeep.id } |
              ForEach-Object {
                Write-Host "Deleting old cache for ${prefix}: $($_.key)"
                gh cache delete $_.id
              }
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tree-ide-windows
          path: |
            dist/*.exe
            dist/*.msi
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $releaseName = "Tree IDE $tag"
          $isPrerelease = $tag -match "(beta|alpha|rc)"

          $files = @(
            Get-ChildItem -Path dist -File |
              Where-Object {
                $_.Name -like "*.exe" -or
                $_.Name -like "*.msi" -or
                $_.Name -like "*.blockmap" -or
                $_.Name -like "latest*.yml"
              }
          )

          if (-not $files) {
            Write-Error "No release files found in dist."
            exit 1
          }

          Write-Host "Release files:"
          $files | ForEach-Object { Write-Host " - $($_.FullName)" }

          $releaseExists = $false
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            $releaseExists = $true
          }

          if ($releaseExists) {
            Write-Host "Release $tag already exists. Updating metadata and replacing assets."
            $editArgs = @("release", "edit", $tag, "--title", $releaseName)
            if ($isPrerelease) {
              $editArgs += "--prerelease"
            } else {
              $editArgs += "--latest"
            }

            & gh @editArgs
          } else {
            $createArgs = @("release", "create", $tag, "--title", $releaseName, "--generate-notes")
            if ($isPrerelease) {
              $createArgs += "--prerelease"
            } else {
              $createArgs += "--latest"
            }

            & gh @createArgs
          }

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $uploadArgs = @("release", "upload", $tag)
          $uploadArgs += $files.FullName
          $uploadArgs += "--clobber"
          & gh @uploadArgs
