name: Build Windows

permissions:
  actions: write
  contents: write
  models: read

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  build-windows-x64:
    name: Build MSI, EXE and Portable (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Cache Electron build dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-build-${{ runner.os }}-x64-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-build-${{ runner.os }}-x64-

      - name: Setup Node app
        uses: ./.github/actions/setup-node-app

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")

          if ($packageVersion -ne $tagVersion) {
            Write-Error "Release tag ${{ github.ref_name }} does not match package.json version $packageVersion."
            exit 1
          }

      - name: Run tests
        run: npm test

      - name: Build Windows x64 artifacts
        shell: pwsh
        run: |
          $maxAttempts = 3
          $publishMode = if ("${{ github.ref }}" -like "refs/tags/v*") { "always" } else { "never" }

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "electron-builder attempt $attempt of $maxAttempts"
            npx electron-builder --win nsis msi portable --x64 --publish $publishMode

            if ($LASTEXITCODE -eq 0) {
              exit 0
            }

            if ($attempt -lt $maxAttempts) {
              $delaySeconds = 20 * $attempt
              Write-Host "electron-builder failed with exit code $LASTEXITCODE. Retrying in $delaySeconds seconds..."
              Start-Sleep -Seconds $delaySeconds
            }
          }

          exit $LASTEXITCODE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean old build caches
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $caches = @(gh cache list --limit 1000 --json id,key,createdAt |
            ConvertFrom-Json |
            Sort-Object { [datetime]$_.createdAt } -Descending)

          if (-not $caches) {
            Write-Host "No caches found."
            exit 0
          }

          function Get-CacheFamily($key) {
            $family = $key -replace "-[a-f0-9]{32,64}$", ""
            $family = $family -replace "-[0-9a-f]{8,}$", ""
            return $family
          }

          $cacheGroups = $caches | Group-Object { Get-CacheFamily $_.key }

          foreach ($group in $cacheGroups) {
            $groupCaches = @($group.Group | Sort-Object { [datetime]$_.createdAt } -Descending)
            $cacheToKeep = $groupCaches | Select-Object -First 1

            Write-Host "Keeping latest previous cache for $($group.Name): $($cacheToKeep.key)"

            $groupCaches |
              Where-Object { $_.id.ToString() -ne $cacheToKeep.id.ToString() } |
              ForEach-Object {
                Write-Host "Deleting old cache for $($group.Name): $($_.key)"
                gh cache delete $_.id 2>$null
                if ($LASTEXITCODE -ne 0) {
                  Write-Host "Cache $($_.id) already removed, skipping."
                }
              }
          }

      - name: Upload Windows x64 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tree-ide-windows-x64
          path: |
            dist/*.exe
            dist/*.msi
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  build-windows-arm:
    name: Build MSI, EXE and Portable (arm64)
    runs-on: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Cache Electron build dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-build-${{ runner.os }}-arm64-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-build-${{ runner.os }}-arm64-

      - name: Setup Node app
        uses: ./.github/actions/setup-node-app

      - name: Run tests
        run: npm test

      - name: Build Windows arm64 artifacts
        shell: pwsh
        run: |
          $maxAttempts = 3
          $publishMode = if ("${{ github.ref }}" -like "refs/tags/v*") { "always" } else { "never" }

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "electron-builder attempt $attempt of $maxAttempts"
            npx electron-builder --win nsis msi portable --arm64 --publish $publishMode

            if ($LASTEXITCODE -eq 0) {
              exit 0
            }

            if ($attempt -lt $maxAttempts) {
              $delaySeconds = 20 * $attempt
              Write-Host "electron-builder failed with exit code $LASTEXITCODE. Retrying in $delaySeconds seconds..."
              Start-Sleep -Seconds $delaySeconds
            }
          }

          exit $LASTEXITCODE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean old build caches
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $caches = @(gh cache list --limit 1000 --json id,key,createdAt |
            ConvertFrom-Json |
            Sort-Object { [datetime]$_.createdAt } -Descending)

          if (-not $caches) {
            Write-Host "No caches found."
            exit 0
          }

          function Get-CacheFamily($key) {
            $family = $key -replace "-[a-f0-9]{32,64}$", ""
            $family = $family -replace "-[0-9a-f]{8,}$", ""
            return $family
          }

          $cacheGroups = $caches | Group-Object { Get-CacheFamily $_.key }

          foreach ($group in $cacheGroups) {
            $groupCaches = @($group.Group | Sort-Object { [datetime]$_.createdAt } -Descending)
            $cacheToKeep = $groupCaches | Select-Object -First 1

            Write-Host "Keeping latest previous cache for $($group.Name): $($cacheToKeep.key)"

            $groupCaches |
              Where-Object { $_.id.ToString() -ne $cacheToKeep.id.ToString() } |
              ForEach-Object {
                Write-Host "Deleting old cache for $($group.Name): $($_.key)"
                gh cache delete $_.id 2>$null
                if ($LASTEXITCODE -ne 0) {
                  Write-Host "Cache $($_.id) already removed, skipping."
                }
              }
          }

      - name: Upload Windows arm64 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tree-ide-windows-arm64
          path: |
            dist/*.exe
            dist/*.msi
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  release-notes:
    name: Translate, localize, and update release
    needs: [build-windows-x64, build-windows-arm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Compute previous tag
        id: meta
        run: |
          tag="${{ github.ref_name }}"
          prev=$(git tag --sort=-v:refname | grep '^v' | grep -v "^$tag$" | head -1 || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prev=${prev:-}" >> "$GITHUB_OUTPUT"
          is_prerelease='false'
          if echo "$tag" | grep -qE '(beta|alpha|rc)'; then
            is_prerelease='true'
          fi
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"

      - name: Wait for release to be created
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          for attempt in $(seq 1 12); do
            if gh release view "$tag" > /dev/null 2>&1; then
              exit 0
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "::error::Release $tag was not created by electron-builder."
              exit 1
            fi
            echo "Release not ready yet, waiting 10s (attempt $attempt/12)..."
            sleep 10
          done

      - name: Build multilingual changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/build-release-changelogs.mjs \
            "${{ steps.meta.outputs.prev }}" \
            "${{ steps.meta.outputs.tag }}" \
            "$RUNNER_TEMP/changelogs"

      - name: Download Windows build artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: tree-ide-windows-*
          merge-multiple: true

      - name: Inject localized releaseNotes into latest.yml
        run: |
          # The build jobs produced a `latest*.yml` per arch (x64, arm64).
          # Both files get the same localized releaseNotes, so the user
          # sees the changelog in their language regardless of which
          # installer they fetch.
          shopt -s nullglob
          for f in dist/latest*.yml; do
            echo "[localize] Processing $f"
            node scripts/inject-localized-notes.mjs \
              --latest "$f" \
              --note "en=$RUNNER_TEMP/changelogs/en.md" \
              --note "pt=$RUNNER_TEMP/changelogs/pt.md"
          done

      - name: Re-upload localized latest.yml to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          shopt -s nullglob
          for f in dist/latest*.yml; do
            echo "[localize] Uploading $f (clobber)"
            gh release upload --clobber "$tag" "$f"
          done

      - name: Update GitHub release body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          version="${tag#v}"
          release_name="Tree IDE v${version}"
          edit_args=(release edit "$tag" --title "$release_name" --notes-file "$RUNNER_TEMP/changelogs/github-release.md")
          if [ "${{ steps.meta.outputs.is_prerelease }}" = 'true' ]; then
            edit_args+=(--prerelease)
          else
            edit_args+=(--latest)
          fi
          gh "${edit_args[@]}"

      - name: Upload changelog files to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          gh release upload --clobber "$tag" \
            "$RUNNER_TEMP/changelogs/changelog.md" \
            "$RUNNER_TEMP/changelogs/en.md" \
            "$RUNNER_TEMP/changelogs/pt.md"
