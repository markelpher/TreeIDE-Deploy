app-id: com.treeide.treeide
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: tree-ide
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  - --filesystem=home
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.Notifications
  - --env=ELECTRON_TRASH=gio
modules:
  - name: tree-ide
    buildsystem: simple
    build-commands:
      - cp -r build-flatpak/staging/linux-unpacked /app/tree-ide
      - |
        if command -v patch-desktop-filename >/dev/null 2>&1; then
          patch-desktop-filename /app/tree-ide/resources/app.asar
        fi
      - install -Dm755 build-flatpak/flatpak/tree-ide.sh /app/bin/tree-ide
      - install -Dm644 build-flatpak/flatpak/com.treeide.treeide.desktop /app/share/applications/com.treeide.treeide.desktop
      - for size in 16 32 48 64 128 256 512; do install -Dm644 build/icons/${size}x${size}.png /app/share/icons/hicolor/${size}x${size}/apps/com.treeide.treeide.png; done
      - install -Dm644 build-flatpak/flatpak/com.treeide.treeide.appdata.xml /app/share/metainfo/com.treeide.treeide.appdata.xml
    sources:
      - type: dir
        path: ../..